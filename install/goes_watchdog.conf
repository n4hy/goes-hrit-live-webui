# GOES web watchdog configuration  ->  installed to /etc/goes_watchdog.conf

# If the newest published PNG is older than this, treat the web output as "stale".
STALE_SECONDS=600

# Optional: require that meta.json updated_utc is within this window too.
META_STALE_SECONDS=900

# Service the watchdog may restart as a last resort.
SATDUMP_SERVICE="satdump-goes19.service"

# Publisher the watchdog runs to try to recover before restarting SatDump.
# NOTE: this must be an installed script. The active publisher is update_goes_multi_web.sh.
PUBLISHER_SCRIPT="/usr/local/bin/update_goes_multi_web.sh"

# Web output root and the files whose age indicates freshness (space-separated,
# relative to WEB_ROOT). meta.json is checked separately via META_STALE_SECONDS.
WEB_ROOT="/var/www/goes"
WEB_FILES="meta.json"

# Where SatDump writes full-disk timestamp directories (must match the publisher).
SATDUMP_FD_ROOT="/home/pi/sat/GOES-19/IMAGES/GOES-19/Full Disk"

# Alert email target (must be deliverable locally; "root" usually works).
ALERT_TO="root"

# Hardening knobs.
RESTART_COOLDOWN_SECONDS=900     # never restart SatDump more often than this
STALE_CONSECUTIVE_REQUIRED=3     # require N consecutive stale runs before restarting SatDump
DISK_MIN_FREE_MB=512             # alert if free space on WEB_ROOT drops below this
