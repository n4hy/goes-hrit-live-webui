# SatDump data retention  ->  installed to /etc/satdump_cleanup.conf

# Days to retain SatDump timestamp directories under ROOT before deletion.
TOOOLD_DAYS=7

# Root under which SatDump writes timestamped image directories.
ROOT="/home/pi/sat"

# Days to retain EMWIN products (text + graphics).
EMWIN_MAX_DAYS=7
