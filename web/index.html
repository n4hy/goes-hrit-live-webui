<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GOES Full Disk (Live)</title>
<link rel="stylesheet" href="/goes/style.css">
</head>
<body>
<div id="container">
  <div id="controls">
    <label>Satellite:</label>
    <select id="satsel"></select>
    <label>Image:</label>
    <select id="imgsel"></select>
    <span class="separator"></span>
    <label>Mode:</label>
    <select id="modesel">
      <option value="live">Live</option>
      <option value="timelapse">Timelapse</option>
      <option value="falsecolor">False Color</option>
    </select>
  </div>

  <div id="timelapse-controls" style="display:none;">
    <label>Band:</label>
    <select id="bandsel">
      <option value="2">CH2 (Visible)</option>
      <option value="7">CH7 (Clean IR)</option>
      <option value="8">CH8 (Water Vapor)</option>
      <option value="13" selected>CH13 (Longwave IR)</option>
    </select>
    <label>Duration:</label>
    <select id="durationsel">
      <option value="3">3 hours</option>
      <option value="6" selected>6 hours</option>
      <option value="12">12 hours</option>
      <option value="24">24 hours</option>
    </select>
    <label>Frames:</label>
    <select id="framesel">
      <option value="12">12</option>
      <option value="24" selected>24</option>
      <option value="36">36</option>
      <option value="48">48</option>
    </select>
    <button id="generatebtn">Generate GIF</button>
    <span id="gifstatus"></span>
  </div>

  <div id="falsecolor-controls" style="display:none;">
    <label>Preset:</label>
    <select id="fcpresetsel">
      <option value="daynight">Day/Night</option>
      <option value="fire">Fire/Hot Spot</option>
      <option value="vegetation">Vegetation</option>
      <option value="sandwich">Sandwich RGB</option>
      <option value="custom">Custom RGB</option>
    </select>
    <div id="custom-rgb" style="display:none;">
      <label>R:</label>
      <select id="fc-r-band">
        <option value="2">CH2</option>
        <option value="7">CH7</option>
        <option value="8">CH8</option>
        <option value="13">CH13</option>
        <option value="14">CH14</option>
      </select>
      <label>G:</label>
      <select id="fc-g-band">
        <option value="2">CH2</option>
        <option value="7" selected>CH7</option>
        <option value="8">CH8</option>
        <option value="13">CH13</option>
        <option value="14">CH14</option>
      </select>
      <label>B:</label>
      <select id="fc-b-band">
        <option value="2">CH2</option>
        <option value="7">CH7</option>
        <option value="8">CH8</option>
        <option value="13" selected>CH13</option>
        <option value="14">CH14</option>
      </select>
    </div>
    <button id="fcgeneratebtn">Generate</button>
    <span id="fcstatus"></span>
  </div>

  <div id="viewer">
    <img id="img" src="" alt="GOES image">
  </div>

  <div id="footer">
    <span id="eventtime"></span>
  </div>
</div>

<script src="/goes/app.js"></script>
</body>
</html>
