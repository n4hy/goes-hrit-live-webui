<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GOES HRIT Live</title>
<link rel="stylesheet" href="/goes/style.css">
</head>
<body>
<div id="container">
  <div id="controls">
    <label>Satellite:</label>
    <select id="satsel"></select>
    <label>Sector:</label>
    <select id="sectorsel">
      <option value="Full_Disk">Full Disk</option>
      <option value="Mesoscale_1">Mesoscale 1</option>
      <option value="Mesoscale_2">Mesoscale 2</option>
    </select>
    <label>Image:</label>
    <select id="imgsel"></select>
    <span class="separator"></span>
    <label>Mode:</label>
    <select id="modesel">
      <option value="live">Live</option>
      <option value="history">History</option>
      <option value="timelapse">Timelapse</option>
      <option value="falsecolor">False Color</option>
      <option value="emwin">EMWIN</option>
    </select>
    <span class="separator"></span>
    <label class="checkbox-label" title="Validate images and reject frames with black bar corruption">
      <input type="checkbox" id="validateimages" checked>
      Validate images
    </label>
  </div>

  <!-- History Controls -->
  <div id="history-controls" style="display:none;">
    <button id="hist-first" title="First">&laquo;</button>
    <button id="hist-prev" title="Previous">&lt;</button>
    <select id="hist-select"></select>
    <button id="hist-next" title="Next">&gt;</button>
    <button id="hist-last" title="Last (Latest)">&raquo;</button>
    <span id="hist-info"></span>
  </div>

  <!-- Timelapse Controls -->
  <div id="timelapse-controls" style="display:none;">
    <label>Band:</label>
    <select id="bandsel">
      <option value="2">CH2 (Visible)</option>
      <option value="7">CH7 (Clean IR)</option>
      <option value="8">CH8 (Water Vapor)</option>
      <option value="13" selected>CH13 (Longwave IR)</option>
    </select>
    <label>Duration:</label>
    <select id="durationsel">
      <option value="3">3 hours</option>
      <option value="6" selected>6 hours</option>
      <option value="12">12 hours</option>
      <option value="24">24 hours</option>
    </select>
    <label>Frames:</label>
    <select id="framesel">
      <option value="12">12</option>
      <option value="24" selected>24</option>
      <option value="36">36</option>
      <option value="48">48</option>
    </select>
    <button id="generatebtn">Generate GIF</button>
    <a id="downloadgif" style="display:none;" download>
      <button type="button">Save GIF</button>
    </a>
    <label class="checkbox-label">
      <input type="checkbox" id="rejectbusted" checked>
      Reject bad frames
    </label>
    <span id="gifstatus"></span>
  </div>

  <!-- False Color Controls -->
  <div id="falsecolor-controls" style="display:none;">
    <label>Preset:</label>
    <select id="fcpresetsel">
      <option value="daynight">Day/Night</option>
      <option value="fire">Fire/Hot Spot</option>
      <option value="vegetation">Vegetation</option>
      <option value="sandwich">Sandwich RGB</option>
      <option value="watervapor">Water Vapor</option>
      <option value="custom">Custom RGB</option>
    </select>
    <div id="custom-rgb" style="display:none;">
      <label>R:</label>
      <select id="fc-r-band">
        <option value="2">CH2</option>
        <option value="7">CH7</option>
        <option value="8">CH8</option>
        <option value="13">CH13</option>
        <option value="14">CH14</option>
      </select>
      <label>G:</label>
      <select id="fc-g-band">
        <option value="2">CH2</option>
        <option value="7" selected>CH7</option>
        <option value="8">CH8</option>
        <option value="13">CH13</option>
        <option value="14">CH14</option>
      </select>
      <label>B:</label>
      <select id="fc-b-band">
        <option value="2">CH2</option>
        <option value="7">CH7</option>
        <option value="8">CH8</option>
        <option value="13" selected>CH13</option>
        <option value="14">CH14</option>
      </select>
    </div>
    <button id="fcgeneratebtn">Generate</button>
    <span id="fcstatus"></span>
  </div>

  <!-- EMWIN Controls -->
  <div id="emwin-controls" style="display:none;">
    <button id="emwin-refresh">Refresh List</button>
    <select id="emwin-select"></select>
    <span id="emwin-status"></span>
  </div>

  <!-- Main Viewer -->
  <div id="viewer">
    <img id="img" src="" alt="GOES image">
    <pre id="emwin-content" style="display:none;"></pre>
  </div>

  <div id="footer">
    <span id="eventtime"></span>
  </div>
</div>

<script src="/goes/app.js"></script>
</body>
</html>
