# goes-hrit-live.conf
# Non-disruptive: separate server on 8080 + optional inclusion into RaspiNOAA for /goes/
server {
  listen 8080;
  server_name _;

  root /var/www/goes;
  index index.html;

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires off;
  }

  # Alias for /goes/ prefix compatibility
  location /goes/ {
    alias /var/www/goes/;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires off;
  }

  location /current/ {
    alias /var/www/goes/current/;
    autoindex on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location /goes/current/ {
    alias /var/www/goes/current/;
    autoindex on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location /timelapse/ {
    alias /var/www/goes/timelapse/;
    autoindex on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location /goes/timelapse/ {
    alias /var/www/goes/timelapse/;
    autoindex on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location /falsecolor/ {
    alias /var/www/goes/falsecolor/;
    autoindex on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location /goes/falsecolor/ {
    alias /var/www/goes/falsecolor/;
    autoindex on;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location /events {
    proxy_pass http://127.0.0.1:8090/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    add_header Cache-Control "no-cache";
  }

  location /goes/events {
    proxy_pass http://127.0.0.1:8090/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    add_header Cache-Control "no-cache";
  }

  location /api/timelapse {
    proxy_pass http://127.0.0.1:8090/api/timelapse;
    proxy_http_version 1.1;
    proxy_set_header Content-Type "application/json";
    proxy_read_timeout 120s;
  }

  location /goes/api/timelapse {
    proxy_pass http://127.0.0.1:8090/api/timelapse;
    proxy_http_version 1.1;
    proxy_set_header Content-Type "application/json";
    proxy_read_timeout 120s;
  }

  location /api/falsecolor {
    proxy_pass http://127.0.0.1:8090/api/falsecolor;
    proxy_http_version 1.1;
    proxy_set_header Content-Type "application/json";
    proxy_read_timeout 60s;
  }

  location /goes/api/falsecolor {
    proxy_pass http://127.0.0.1:8090/api/falsecolor;
    proxy_http_version 1.1;
    proxy_set_header Content-Type "application/json";
    proxy_read_timeout 60s;
  }

  location /api/history/image {
    proxy_pass http://127.0.0.1:8090/api/history/image;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location /goes/api/history/image {
    proxy_pass http://127.0.0.1:8090/api/history/image;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location /api/history {
    proxy_pass http://127.0.0.1:8090/api/history;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
  }

  location /goes/api/history {
    proxy_pass http://127.0.0.1:8090/api/history;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
  }

  location /api/emwin {
    proxy_pass http://127.0.0.1:8090/api/emwin;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location /goes/api/emwin {
    proxy_pass http://127.0.0.1:8090/api/emwin;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location /api/emwin/read {
    proxy_pass http://127.0.0.1:8090/api/emwin/read;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
  }

  location /goes/api/emwin/read {
    proxy_pass http://127.0.0.1:8090/api/emwin/read;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
  }

  location /api/sectors {
    proxy_pass http://127.0.0.1:8090/api/sectors;
    proxy_http_version 1.1;
    proxy_read_timeout 10s;
  }

  location /goes/api/sectors {
    proxy_pass http://127.0.0.1:8090/api/sectors;
    proxy_http_version 1.1;
    proxy_read_timeout 10s;
  }

  location /api/stats {
    proxy_pass http://127.0.0.1:8090/api/stats;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location /goes/api/stats {
    proxy_pass http://127.0.0.1:8090/api/stats;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
  }

  location /api/validation {
    proxy_pass http://127.0.0.1:8090/api/validation;
    proxy_http_version 1.1;
    proxy_read_timeout 10s;
  }

  location /goes/api/validation {
    proxy_pass http://127.0.0.1:8090/api/validation;
    proxy_http_version 1.1;
    proxy_read_timeout 10s;
  }
}
